
name: Databricks Deploy - Pre-Prod

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Databricks Pre-Prod
    runs-on: ubuntu-latest
    environment: preprod

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        run: python -m pip install uv

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks OIDC authentication
        working-directory: /tmp
        run: databricks current-user me

      - name: Validate Pre-Prod bundle
        run: databricks bundle validate -t preprod

      - name: Deploy Pre-Prod bundle
        run: databricks bundle deploy -t preprod
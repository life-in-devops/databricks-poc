
name: Databricks POC - Deploy Prod

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Databricks to Production
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify release commit belongs to main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Production authentication
        working-directory: /tmp
        run: |
          databricks auth describe
          databricks current-user me

      - name: Validate Production bundle
        run: databricks bundle validate -t prod

      - name: Deploy Production bundle
        run: databricks bundle deploy -t prod
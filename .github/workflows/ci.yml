
name: Databricks POC - CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Code Validation and Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --group preprod

      - name: Run Ruff linting
        run: uv run ruff check src/databricks_poc src/databricks_poc_etl tests

      - name: Check Python formatting
        run: uv run ruff format --check src/databricks_poc src/databricks_poc_etl tests

      - name: Run unit tests
        run: uv run pytest

      - name: Build Python wheel
        run: uv build --wheel


bundle:
  name: databricks_poc
  uuid: 8cdfe84c-7c3f-457a-8fe5-4532f840fb1b

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: Unity Catalog catalog name

  schema:
    description: Unity Catalog schema name

  customer_source_file:
    description: Customer CSV filename for ingestion
    default: customers.csv

targets:
  preprod:
    default: true

    workspace:
      host: https://adb-7405604730523602.2.azuredatabricks.net

    variables:
      catalog: dev
      schema: preprod
      customer_source_file: customers_synthetic.csv

  prod:
    mode: production

    workspace:
      host: https://adb-7405618154117587.7.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: prod
      schema: production
      customer_source_file: customers.csv

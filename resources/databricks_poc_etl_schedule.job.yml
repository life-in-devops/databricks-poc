resources:
  jobs:
    databricks_poc_etl_schedule:
      name: databricks_poc_etl_schedule

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      tasks:
        - task_key: refresh_etl
          pipeline_task:
            pipeline_id: ${resources.pipelines.databricks_poc_etl.id}
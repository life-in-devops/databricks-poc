
resources:
  jobs:
    sample_job:
      name: sample_job

      parameters:
        - name: catalog
          default: ${var.catalog}

        - name: schema
          default: ${var.schema}

        - name: source_file
          default: ${var.customer_source_file}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/sample_notebook.ipynb

        - task_key: python_wheel_task
          depends_on:
            - task_key: notebook_task

          python_wheel_task:
            package_name: databricks_poc
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--source-file"
              - "${var.customer_source_file}"

          environment_key: default

        - task_key: refresh_pipeline
          depends_on:
            - task_key: notebook_task

          pipeline_task:
            pipeline_id: ${resources.pipelines.databricks_poc_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: UNPAUSED

      max_concurrent_runs: 1
